<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nick Sơ Sinh</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="index.html">
</head>

<body>

<header class="sub-header">

    <div class="container navbar">

        <div class="logo">
            <div class="logo-icon">🐉</div>
            <h1>Nick Sơ Sinh</h1>
        </div>

        <nav>
            <a href="index.html">Trang Chủ</a>
            <a href="#">Hướng Dẫn</a>
            <a href="#">Liên Hệ</a>
        </nav>

    </div>

</header>

<section class="nick-shop">

    <div class="container">

        <!-- FILTER -->

        <div class="shop-filter">

            <input type="text"
                   placeholder="Tìm mã số acc">

            <select>
                <option>Tất cả hành tinh</option>
                <option>Trái đất</option>
                <option>Namec</option>
                <option>Xayda</option>
            </select>

            <select>
                <option>Tất cả server</option>
                <option>Server 1</option>
                <option>Server 2</option>
            </select>

            <button>Tìm Kiếm</button>

        </div>

        <!-- GRID -->

        <div class="shop-grid">

            <!-- CARD -->

            <div class="shop-card">

                <img src="images/sosinh1.jpg" alt="">

                <div class="shop-info">

                    <h3>ACC #44553</h3>

                    <p>🌍 Hành tinh: Trái đất</p>

                    <p>⭐ Server: 9 sao</p>

                    <div class="shop-price">
                        30,000đ
                    </div>

                    <button>Mua Ngay</button>

                </div>

            </div>

        </div>

    </div>

</section>

</body>
</html>
